version = 1

[server]
listen = "127.0.0.1:7331"
public_url = "http://127.0.0.1:7331"
graceful_shutdown_seconds = 30
request_body_limit_mb = 128
trusted_proxies = []

[database]
url = "sqlite://./data/boxd.sqlite3?mode=rwc"
auto_migrate = true
max_connections = 10
min_connections = 0
connect_timeout_seconds = 10

[auth]
enabled = true
bootstrap_admin_user = "admin"
bootstrap_admin_password_env = "BOXD_ADMIN_PASSWORD"
master_key_env = "BOXD_MASTER_KEY"
api_key_header = "X-Box-Api-Key"
session_ttl_seconds = 43200

[storage]
data_dir = "./data"
images_dir = "./data/images"
boxes_dir = "./data/boxes"
snapshots_dir = "./data/snapshots"
recordings_dir = "./data/recordings"
minimum_free_gib = 10

[runtime]
driver = "libkrun"
libkrun_version = "1.19.4"
bundle_registry = "https://releases.example.com/boxd/runtimes"
# This is an intentionally unusable registry placeholder. Keep auto-pull off
# until both a real registry and its Ed25519 trust roots are configured.
auto_pull = false
verify_signatures = true
trusted_signing_keys = {}
agent_vsock_port = 18080
boot_timeout_seconds = 30
shutdown_timeout_seconds = 10

[resources]
max_running_boxes = 4
max_total_memory_mib = 16384
max_total_vcpus = 8
default_disk_gib = 20
[resources.profiles.small]
vcpus = 2
memory_mib = 4096
[resources.profiles.medium]
vcpus = 4
memory_mib = 8192
[resources.profiles.large]
vcpus = 8
memory_mib = 16384

[network]
default_policy = "restricted-default"
# Numeric public IPv4 resolvers only. Guest DNS is proxied through the
# restricted data plane; these addresses are never exposed as direct routes.
dns_servers = ["1.1.1.1"]
# Optional certificate-validated DNS-over-HTTPS authority. When set, boxd
# pins its TLS connection to the numeric dns_servers above and performs no
# implicit host lookup. Leave empty to use bounded UDP DNS.
dns_over_https_name = ""
allow_private_cidrs = false
[preview]
mode = "path"
base_url = "http://127.0.0.1:7331"
path_prefix = "/p"
wildcard_domain = ""
[console]
enabled = true
base_path = "/console"
[observability]
log_format = "pretty"
log_level = "info"
metrics_enabled = true
metrics_path = "/metrics"
# Empty disables OTLP export. Set this to the collector's OTLP/HTTP traces
# endpoint, for example http://127.0.0.1:4318/v1/traces.
otlp_endpoint = ""
otlp_timeout_seconds = 5

[models]
# Browser extract/observe/act/run use provider-prefixed names. Credentials are
# resolved per account/box from encrypted environment settings; only the
# environment variable name is configured here.
default_model = "anthropic/claude-sonnet-4-5"

[models.providers.anthropic]
kind = "anthropic"
base_url = "https://api.anthropic.com"
api_key_env = "ANTHROPIC_API_KEY"

[models.providers.openai]
kind = "openai"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"

[models.providers.openrouter]
kind = "openai"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"

[models.providers.vercel]
kind = "openai"
base_url = "https://ai-gateway.vercel.sh/v1"
api_key_env = "AI_GATEWAY_API_KEY"

[recording]
# 也可配置可信的绝对路径；basename 会在 boxd 启动时从 PATH 解析并固定。
ffmpeg_path = "ffmpeg"
max_file_mib = 512
tenant_max_gib = 10

[quotas]
# Token bucket is isolated by authenticated API-key fingerprint. Secrets are
# never retained or logged by the limiter.
api_key_requests_per_minute = 600
api_key_request_burst = 100
api_key_traffic_mib_per_minute = 1024
api_key_traffic_burst_mib = 256
max_tracked_api_keys = 10000
idle_entry_ttl_seconds = 900
tenant_max_boxes = 4
tenant_max_disk_gib = 80
tenant_max_concurrent_runs = 4

[features]
browser = true
schedules = true
custom_network_policy = false
attach_headers = false
