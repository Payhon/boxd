name: phase1-linux-kvm

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Self-hosted runner architecture label
        required: true
        default: x64
        type: choice
        options:
          - x64
          - ARM64
      skip_source_gates:
        description: Skip source gates already covered by linux-ci
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: phase1-linux-kvm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-kvm:
    runs-on: [self-hosted, linux, boxd-kvm, "${{ inputs.architecture }}"]
    timeout-minutes: 90
    env:
      BOXD_SMOKE_CONFIG: ${{ vars.BOXD_KVM_CONFIG }}
      BOXD_RUNTIME_BUNDLE: ${{ vars.BOXD_KVM_RUNTIME_BUNDLE }}
      BOXD_EMBEDDED_LIBKRUN_PATH: ${{ vars.BOXD_KVM_LIBKRUN_PATH }}
      BOXD_EMBEDDED_LIBKRUN_SHA256: ${{ vars.BOXD_KVM_LIBKRUN_SHA256 }}
      BOXD_EMBEDDED_LIBKRUN_LICENSE_PATH: ${{ vars.BOXD_KVM_LIBKRUN_LICENSE_PATH }}
      BOXD_EMBEDDED_LIBKRUNFW_PATH: ${{ vars.BOXD_KVM_LIBKRUNFW_PATH }}
      BOXD_EMBEDDED_LIBKRUNFW_SHA256: ${{ vars.BOXD_KVM_LIBKRUNFW_SHA256 }}
      BOXD_EMBEDDED_LIBKRUNFW_LICENSE_PATH: ${{ vars.BOXD_KVM_LIBKRUNFW_LICENSE_PATH }}
      BOXD_MASTER_KEY: ${{ secrets.BOXD_KVM_MASTER_KEY }}
      BOXD_ADMIN_PASSWORD: ${{ secrets.BOXD_KVM_ADMIN_PASSWORD }}
      UPSTASH_BOX_API_KEY: ${{ secrets.BOXD_KVM_API_KEY }}
      UPSTASH_BOX_BASE_URL: http://127.0.0.1:7331
      BOXD_SKIP_SOURCE_GATES: ${{ inputs.skip_source_gates && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy,rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: compat/upstash-box-0.6.3/package-lock.json
      - name: Set runner-owned output paths
        shell: bash
        run: |
          printf 'BOXD_EVIDENCE_DIR=%s/boxd-phase1-kvm-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          printf 'BOXD_KVM_TARGET_DIR=%s/boxd-phase1-kvm-target-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Verify native Linux KVM runner inputs
        shell: bash
        run: |
          test "$(uname -s)" = Linux
          test -c /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          test -f /sys/fs/cgroup/cgroup.controllers
          test -n "$BOXD_SMOKE_CONFIG"
          test -n "$BOXD_RUNTIME_BUNDLE"
      - name: Run native KVM gate
        run: scripts/phase1-linux-kvm-smoke.sh
      - name: Upload redacted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-linux-kvm-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BOXD_EVIDENCE_DIR }}
          if-no-files-found: warn
          retention-days: 14
