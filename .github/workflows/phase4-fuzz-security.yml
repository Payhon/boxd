name: phase4-fuzz-security

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hermetic-fuzz-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      PHASE4_PLATFORM_GATE: blocked
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Validate security matrix
        run: |
          python3 scripts/phase4-security-matrix.py --cases tests/security/cases.json > security-matrix.json
          python3 -m unittest discover -s tests/security -p 'test_*.py'
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.12.0 --locked
      - name: Build fuzz targets
        run: cargo fuzz build
      - name: Hermetic bounded fuzz smoke
        run: |
          for target in network_policy dns api_json http_sse path_archive; do
            cargo fuzz run "$target" -- -runs=64 -max_len=65536
          done
      - name: Record platform boundary
        run: |
          test "$PHASE4_PLATFORM_GATE" = blocked
          printf '%s\n' '{"platform_gate":"blocked","reason":"real HVF/KVM requires protected native runners"}' > platform-gate.json
      - name: Upload redacted hermetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-fuzz-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            security-matrix.json
            platform-gate.json
          if-no-files-found: warn
          retention-days: 14
